<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://kit.fontawesome.com/6621c552df.js" crossorigin="anonymous"></script>
    <title>Controle Limpeza</title>
</head>
<body>
    <header>
        <img src="/assets/img/logo-horizontal.png" alt="Logo Hospital">
        <nav>
            <a href="/index.html"><span><i class="fa-solid fa-house"></i></span> Início</a>
            <a href="#"><span><i class="fa-solid fa-mattress-pillow"></i></span> Check-list Camareira</a>
            <a href="#"><span><i class="fa-solid fa-calendar-days"></i></span> Check-list Cronograma</a>
        </nav>
    </header>
    <main class="lancarServicos">
        <div class="controle">
            <h1>FAXINA</h1>
            <div class="informacoes_controle">
                <div class="dados_controle">
                    <label for="setor">Setor/Ala:</label>
                    <select name="setor" id="setor" onchange="mostrarForm()" required>
                        <option value="">Selecione</option>
                        <option value="noturno">Noturno</option>
                        <option value="c1">C-1</option>
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                        <option value="D">D</option>
                        <option value="E">E</option>
                        <option value="Ambulatorio Covid">Ambulatório Covid-19</option>
                        <option value="Bloco Cirurgico">Bloco Cirurgico</option>
                    </select>
                </div>
                <div class="dados_controle">
                    
                </div>
                <div class="dados_controle">
                    <label for="nome">Responsável:</label>
                    <input type="text" id="nome" name="nome" placeholder="João Maria" required>
                    <label for="data">Data:</label>
                    <input type="date" id="data" name="data" required>
                </div>
            </div>
        </div>
        <div id="checklist">
            <h1>Setor de Limpeza</h1>
            <p id="nomeSetor">

            </p>
            <form id="formulario">
                <div class="logoHospital">
                    <img src="/assets/img/logo-horizontal.png" alt="Logo Hospital">
                </div>                    
            </form>
        </div>
        <div class="registrar">
            <input type="submit" value="REGISTRAR SERVIÇO" onclick="verDados()"  >
        </div>
    </main>
    <footer>
        <div class="textoFooter">
            <h1>HOSPITAL DE BAEPENDI</h1>
            <p>Cônego Monte Raro</p>
        </div>
        
    </footer>
    <script src="/script/script.js"></script>
</body>
</html>
